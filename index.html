<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="description"
    content="未构 WeGrow｜AI全案营销增长系统服务商"
  >

  <title>未构 WeGrow</title>

  <link
    rel="stylesheet"
    href="./css/style.css?v=1"
  >
</head>

<body class="page-locked">

  <!-- ==================================
       第一阶段：纯蓝开屏
       ================================== -->
  <section
    id="intro"
    class="intro"
    aria-label="未构官网开屏"
  >
    <div class="intro__content">

      <div class="intro__title">
        WE GROW
      </div>

      <button
        id="enterButton"
        class="intro__button"
        type="button"
      >
        <span>进入官网</span>
        <span>→</span>
      </button>

      <p class="intro__tip">
        CLICK TO ENTER
      </p>

    </div>
  </section>


  <!-- ==================================
       官网主体
       ================================== -->
  <main
    id="site"
    class="site"
    aria-hidden="true"
  >

    <!-- 顶部导航 -->
    <header class="site-header">

      <a
        class="site-header__logo"
        href="#home"
        aria-label="返回首页"
      >
        <img
          src="./images/logo/logo-full.png"
          alt="未构 WeGrow"
        >
      </a>

      <nav class="site-header__nav">
        <a href="#home">首页</a>
        <a href="#services">服务能力</a>
        <a href="#cases">项目案例</a>
        <a href="#contact">联系我们</a>
      </nav>

    </header>


    <!-- ==================================
         首页大屏
         ================================== -->
<section
  id="home"
  class="hero"
>

  <!-- Logo组合动画 -->
  <div
    id="brandReveal"
    class="brand-reveal"
  >
    <div class="logo-motion">

      <img
        class="logo-motion__shape"
        src="./images/logo-shape.png"
        alt=""
        draggable="false"
      >

      <img
        class="logo-motion__text"
        src="./images/logo-text.png"
        alt="WE GROW"
        draggable="false"
      >

    </div>
  </div>


  <!-- 品牌视频海报 -->
  <div
    id="heroPoster"
    class="hero-poster"
    aria-hidden="true"
  >

    <img
      class="hero-poster__image"
      src="./images/hero-poster.png"
      alt="未构品牌宣传片"
      draggable="false"
    >

    <div class="hero-poster__shade"></div>


    <button
      id="playButton"
      class="play-button"
      type="button"
      aria-label="播放公司品牌视频"
    >
      <span class="play-button__circle">
        <span class="play-button__triangle"></span>
      </span>

      <span class="play-button__label">
        PLAY BRAND FILM
      </span>
    </button>


    <div class="hero-poster__caption">
      <strong>WEGROW</strong>

      <p>
        AI MARKETING GROWTH SYSTEM
      </p>
    </div>

  </div>

</section>

      <!-- 第二阶段：Logo组合动画 -->
      <div
        id="brandReveal"
        class="brand-reveal"
      >
        <div class="logo-motion">

          <img
            class="logo-motion__shape"
            src="./images/logo/logo-shape.png"
            alt=""
            draggable="false"
          >

          <img
            class="logo-motion__text"
            src="./images/logo/logo-text.png"
            alt="WE GROW"
            draggable="false"
          >

        </div>
      </div>


      <!-- 第三阶段：品牌海报 -->
      <div
        id="heroPoster"
        class="hero-poster"
        aria-hidden="true"
      >

        <img
          class="hero-poster__image"
          src="./images/hero/hero-poster.png"
          alt="未构公司品牌宣传片"
          draggable="false"
        >

        <div class="hero-poster__shade"></div>


        <!-- 播放按钮 -->
        <button
          id="playButton"
          class="play-button"
          type="button"
          aria-label="播放公司品牌视频"
        >
          <span class="play-button__circle">
            <span class="play-button__triangle"></span>
          </span>

          <span class="play-button__label">
            PLAY BRAND FILM
          </span>
        </button>


        <!-- 左下角品牌信息 -->
        <div class="hero-poster__caption">
          <strong>WEGROW</strong>

          <p>
            AI MARKETING GROWTH SYSTEM
          </p>
        </div>

      </div>

    </section>


    <!-- 后期继续增加 -->
    <section
      id="services"
      class="page-section"
    >
      <span>01</span>
      <h2>服务能力</h2>
      <p>该板块后续继续搭建。</p>
    </section>


    <section
      id="cases"
      class="page-section"
    >
      <span>02</span>
      <h2>项目案例</h2>
      <p>该板块后续继续搭建。</p>
    </section>


    <section
      id="contact"
      class="page-section"
    >
      <span>03</span>
      <h2>联系我们</h2>
      <p>该板块后续继续搭建。</p>
    </section>

  </main>


  <!-- ==================================
       品牌视频弹窗
       ================================== -->
  <div
    id="videoModal"
    class="video-modal"
    aria-hidden="true"
  >

    <button
      id="closeVideoButton"
      class="video-modal__close"
      type="button"
      aria-label="关闭视频"
    >
      ×
    </button>

    <video
      id="brandVideo"
      class="video-modal__video"
      src="./videos/brand-video.mp4"
      poster="./images/hero/hero-poster.png"
      controls
      playsinline
      webkit-playsinline
      preload="metadata"
    >
      当前浏览器不支持视频播放。
    </video>

  </div>


  <noscript>
    请开启浏览器 JavaScript 后访问未构官网。
  </noscript>


  <!-- 功能模块必须先加载 -->
  <script src="./js/modules/intro.js?v=1"></script>
  <script src="./js/modules/brand-video.js?v=1"></script>

  <!-- 主入口最后加载 -->
  <!-- 开屏与Logo动画模块 -->
<script src="./js/modules/intro.js?v=1"></script>

<!-- 品牌视频模块 -->
<script src="./js/modules/brand-video.js?v=1"></script>

<!-- 主入口必须最后加载 -->
<script src="./js/main.js?v=3"></script>

</body>
</html>
