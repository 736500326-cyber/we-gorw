<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="description"
    content="未构 WeGrow｜AI全案营销增长系统服务商"
  >

  <title>未构 WeGrow</title>

  <link rel="stylesheet" href="./css/style.css">
</head>

<body class="page-locked">

  <!-- =====================================
       蓝色开屏
       ===================================== -->
  <section
    id="intro"
    class="intro"
    aria-label="未构官网开屏"
  >

    <div class="intro__content">

      <div class="intro__name">
        WE GROW
      </div>

      <button
        id="enterButton"
        class="intro__button"
        type="button"
      >
        <span>进入官网</span>
        <span class="intro__arrow">→</span>
      </button>

      <p class="intro__tip">
        CLICK TO ENTER
      </p>

    </div>

  </section>


  <!-- =====================================
       官网主体
       ===================================== -->
  <main
    id="site"
    class="site"
    aria-hidden="true"
  >

    <!-- 顶部导航 -->
    <header class="site-header">

      <a
        class="site-header__logo"
        href="#home"
        aria-label="返回首页"
      >
        <img
          src="./images/logo-full.png"
          alt="未构 WeGrow"
        >
      </a>

<!-- 手机菜单按钮 -->
<button
  id="mobileMenuButton"
  class="mobile-menu-button"
  type="button"
  aria-label="打开手机导航"
  aria-expanded="false"
>
  <span></span>
  <span></span>
  <span></span>
</button>


<!-- 导航菜单 -->
<nav
  id="siteNavigation"
  class="site-header__nav"
  aria-label="主导航"
>
  <a href="#home">首页</a>
  <a href="#services">服务能力</a>
  <a href="#cases">项目案例</a>
  <a href="#contact">联系我们</a>
</nav>

    </header>


    <!-- =====================================
         首页首屏
         ===================================== -->
    <section
      id="home"
      class="hero"
    >

      <!-- LOGO组合动画 -->
      <div
        id="logoMotion"
        class="logo-motion"
        aria-label="未构 WeGrow Logo动画"
      >

        <!-- 图三：蓝色图形 -->
        <img
          class="logo-motion__shape"
          src="./images/logo-shape.png"
          alt=""
          draggable="false"
        >

        <!-- 图二：文字部分 -->
        <img
          class="logo-motion__text"
          src="./images/logo-text.png"
          alt="WE GROW"
          draggable="false"
        >

      </div>


      <!-- 首屏文字 -->
      <div class="hero-copy">

        <p class="hero-copy__eyebrow">
          AI MARKETING GROWTH SYSTEM
        </p>

        <h1>
          让AI从工具，
          <br>
          变成企业持续增长的执行系统
        </h1>

        <p class="hero-copy__description">
          AI全案营销增长系统服务商
          <br>
          他们教企业使用AI，我们陪企业用AI拿结果。
        </p>

        <div class="hero-copy__actions">

          <a
            class="primary-button"
            href="#services"
          >
            查看服务能力
          </a>

          <a
            class="secondary-button"
            href="#contact"
          >
            联系我们
          </a>

        </div>

      </div>

    </section>


    <!-- 暂时用于测试滚动 -->
    <section
      id="services"
      class="placeholder-section"
    >
      <span>01</span>
      <h2>服务能力</h2>
      <p>下一步继续搭建这一部分。</p>
    </section>


    <section
      id="cases"
      class="placeholder-section"
    >
      <span>02</span>
      <h2>项目案例</h2>
      <p>下一步继续搭建这一部分。</p>
    </section>


    <section
      id="contact"
      class="placeholder-section"
    >
      <span>03</span>
      <h2>联系我们</h2>
      <p>下一步继续搭建这一部分。</p>
    </section>

  </main>


  <noscript>
    请开启浏览器JavaScript后访问未构官网。
  </noscript>

  <script src="./js/main.js?v=2"></script>

</body>
</html>
